stages:
  - build

build-image:
  stage: build
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: /certs/client
  timeout: 2h
  rules:
    - if: '$CI_COMMIT_BRANCH'
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" --password-stdin
  script:
    - |
      set -eu
      docker buildx create --driver docker-container --use
      image_ref="${CI_REGISTRY_IMAGE}:${CI_COMMIT_REF_SLUG}-${CI_COMMIT_SHORT_SHA}"
      docker buildx build \
        --file Dockerfile \
        --platform linux/amd64 \
        --build-arg ZEROCLAW_BUILD_ID="$CI_COMMIT_SHA" \
        --tag "$image_ref" \
        --push \
        .
      printf 'IMAGE_REF=%s\n' "$image_ref" > image.env
      printf 'Pushed %s\n' "$image_ref"
  artifacts:
    reports:
      dotenv: image.env
