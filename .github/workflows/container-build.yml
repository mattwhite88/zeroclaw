name: Branch Container Build

on:
  push:
    branches: ['**']

concurrency:
  group: branch-container-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and push linux/amd64 image
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Prepare image reference
        id: image
        shell: bash
        run: |
          set -euo pipefail

          branch_slug="$(printf '%s' "$GITHUB_REF_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-63 \
            | sed -E 's/-+$//')"
          if [[ -z "$branch_slug" ]]; then
            branch_slug=branch
          fi
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_ref="ghcr.io/${repository}:${branch_slug}-${GITHUB_SHA:0:8}"

          echo "ref=${image_ref}" >> "$GITHUB_OUTPUT"
          {
            echo '### Branch container image'
            echo
            echo "Built \`${image_ref}\` for \`linux/amd64\`."
            if [[ "$GITHUB_REPOSITORY" == 'zeroclaw-labs/zeroclaw' ]]; then
              echo 'Publish destination: GHCR.'
            else
              echo 'Fork builds are validated without publishing to GHCR.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log in to GHCR
        if: github.repository == 'zeroclaw-labs/zeroclaw'
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build branch image
        uses: docker/build-push-action@1dc73863535b631f98b2378be8619f83b136f4a0 # v6.18.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: ${{ github.repository == 'zeroclaw-labs/zeroclaw' }}
          tags: ${{ steps.image.outputs.ref }}
          build-args: ZEROCLAW_BUILD_ID=${{ github.sha }}
